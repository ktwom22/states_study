<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Algebra Arena ⚡</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F0F4F8;
      --card: #FFFFFF;
      --primary: #4F46E5;
      --accent: #F59E0B;
      --success: #10B981;
      --danger: #EF4444;
      --text: #1E293B;
      --board-bg: #1E293B;
    }
    * {
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 12px 12px 100px 12px; /* padding-bottom so bottom slider doesn't overlap controls */
      touch-action: manipulation;
    }
    .nav-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      background: #E2E8F0;
      padding: 6px;
      border-radius: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .nav-toggle a {
      text-decoration: none;
      color: #64748B;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .nav-toggle a.active {
      background: #FFFFFF;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .game-card {
      background: var(--card);
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 490px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
    }
    h1 {
      font-family: 'Fredoka One', cursive;
      color: var(--primary);
      margin: 0 0 10px 0;
      font-size: 1.7rem;
    }
    .level-pills {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .lvl-btn {
      background: #F1F5F9;
      border: 1.5px solid #CBD5E1;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      color: #64748B;
      transition: 0.2s;
    }
    .lvl-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #EEF2FF;
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    /* EQUATION BOARD */
    .equation-board {
      background: var(--board-bg);
      color: #38BDF8;
      border-radius: 16px;
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.25);
    }
    .sub-tag {
      font-size: 0.8rem;
      color: #94A3B8;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .eq-text {
      font-family: 'Fredoka One', cursive;
      font-size: 2.1rem;
      letter-spacing: 1.5px;
    }

    /* WORKSPACE & UTILITY BUTTONS */
    .utility-bar {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .util-btn {
      flex: 1;
      background: #F8FAFC;
      border: 1.5px solid #CBD5E1;
      border-radius: 12px;
      padding: 9px 8px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .util-btn.active {
      background: #EEF2FF;
      border-color: var(--primary);
      color: var(--primary);
    }

    /* COLLAPSIBLE SCRATCHPAD WORKSPACE */
    .scratch-collapse {
      display: none;
      background: #0F172A;
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      text-align: left;
      animation: fadeIn 0.2s ease-out;
    }
    .scratch-collapse.open {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .scratch-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .sticky-problem-label {
      font-size: 0.75rem;
      color: #94A3B8;
      text-transform: uppercase;
      font-weight: 700;
    }
    .sticky-problem-eq {
      font-family: 'Fredoka One', cursive;
      color: #38BDF8;
      font-size: 1.35rem;
    }
    .scratch-modes {
      display: flex;
      gap: 6px;
    }
    .mini-btn {
      background: #1E293B;
      color: #94A3B8;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .mini-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* STEP-BUILDER VIEW */
    .step-log {
      min-height: 50px;
      max-height: 110px;
      overflow-y: auto;
      font-family: 'Fredoka One', cursive;
      color: #F8FAFC;
      font-size: 1.15rem;
      line-height: 1.6;
      padding-left: 4px;
    }
    .step-log div {
      border-bottom: 1px dashed rgba(255,255,255,0.08);
      padding: 2px 0;
    }
    .action-chips-title {
      font-size: 0.75rem;
      color: #94A3B8;
      font-weight: 700;
      margin: 8px 0 6px 0;
      text-transform: uppercase;
    }
    .action-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip-btn {
      background: #1E293B;
      color: #FBBF24;
      border: 1.5px solid #F59E0B;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .chip-btn:active {
      transform: scale(0.92);
      background: #F59E0B;
      color: #000;
    }

    /* CANVAS FREEHAND VIEW */
    .canvas-wrap {
      display: none;
      height: 140px;
      position: relative;
      background: #0B0F19;
      border-radius: 10px;
      touch-action: none;
    }
    #freehand-canvas {
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* ANSWER OPTIONS */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    button.opt-btn {
      background: #F8FAFC;
      border: 2px solid #CBD5E1;
      border-radius: 14px;
      padding: 13px 8px;
      font-size: 1.3rem;
      font-family: 'Fredoka One', cursive;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button.opt-btn:hover:not(:disabled) {
      background: #EEF2FF;
      border-color: var(--primary);
      color: var(--primary);
    }
    button.correct {
      background-color: var(--success) !important;
      border-color: var(--success) !important;
      color: #fff !important;
    }
    button.wrong {
      background-color: var(--danger) !important;
      border-color: var(--danger) !important;
      color: #fff !important;
    }
    .hint-box {
      font-size: 0.95rem;
      color: #475569;
      min-height: 38px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
    }
    .btn-hint {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: underline;
    }
    .btn-next {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 13px 20px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      width: 100%;
      display: none;
    }

    /* DOCKED BOTTOM SLIDE-UP CALCULATOR DRAWER (Never covers top problems) */
    .calc-drawer {
      position: fixed;
      bottom: -360px; /* Hidden below viewport */
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      transition: bottom 0.28s cubic-bezier(0.1, 0.9, 0.2, 1);
      z-index: 1000;
      pointer-events: none;
    }
    .calc-drawer.open {
      bottom: 0;
      pointer-events: auto;
    }
    .calc-box {
      background: #FFFFFF;
      width: 100%;
      max-width: 440px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.2);
      padding: 12px 16px 20px 16px;
      border: 1.5px solid #CBD5E1;
      border-bottom: none;
    }
    .calc-handle {
      width: 40px;
      height: 4px;
      background: #CBD5E1;
      border-radius: 4px;
      margin: 0 auto 10px auto;
      cursor: pointer;
    }
    .calc-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .calc-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748B;
      text-transform: uppercase;
    }
    .calc-close-icon {
      background: #F1F5F9;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748B;
      cursor: pointer;
    }
    .calc-screen {
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 10px;
      padding: 8px 12px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      text-align: right;
      color: #0F172A;
      margin-bottom: 10px;
      min-height: 44px;
      overflow-x: auto;
    }
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .calc-key {
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 8px;
      padding: 10px 0;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
    }
    .calc-key:active {
      background: #E2E8F0;
      transform: scale(0.96);
    }
    .calc-key.op {
      background: #EEF2FF;
      color: var(--primary);
      border-color: #C7D2FE;
    }
    .calc-key.eq {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

<div class="nav-toggle">
  <a href="/">🔍 Shapes</a>
  <a href="/map">🗺️ Map</a>
  <a href="/math" class="active">⚡ Algebra</a>
</div>

<div class="game-card">
  <h1>Algebra Arena ⚡</h1>

  <div class="level-pills">
    <button class="lvl-btn active" onclick="setLevel('1', this)">1-Step</button>
    <button class="lvl-btn" onclick="setLevel('2', this)">2-Step</button>
    <button class="lvl-btn" onclick="setLevel('3', this)">Brackets</button>
    <button class="lvl-btn" onclick="setLevel('4', this)">Both Sides</button>
  </div>

  <div class="stats-bar">
    <div>⭐ Score: <span id="score">0</span></div>
    <div>🔥 Streak: <span id="streak">0</span></div>
  </div>

  <!-- MAIN EQUATION DISPLAY (Always stays visible) -->
  <div class="equation-board">
    <div class="sub-tag">Find the value of x</div>
    <div class="eq-text" id="eq-text">...</div>
  </div>

  <!-- WORKSPACE & CALCULATOR TOGGLES -->
  <div class="utility-bar">
    <button class="util-btn" id="scratch-toggle-btn" onclick="toggleScratchpad()">
      <span>✏️</span> <span id="scratch-toggle-label">Open Scratchpad</span>
    </button>
    <button class="util-btn" id="calc-toggle-btn" onclick="toggleCalculator()">
      <span>🧮</span> <span>Calculator</span>
    </button>
  </div>

  <!-- COLLAPSIBLE WORKSPACE WITH STICKY PROBLEM HEADER -->
  <div class="scratch-collapse" id="scratch-workspace">
    <div class="scratch-header">
      <div>
        <div class="sticky-problem-label">Current Problem</div>
        <div class="sticky-problem-eq" id="sticky-eq">...</div>
      </div>
      <div class="scratch-modes">
        <button class="mini-btn active" id="btn-mode-steps" onclick="switchWorkMode('steps')">Steps</button>
        <button class="mini-btn" id="btn-mode-pen" onclick="switchWorkMode('pen')">Draw</button>
        <button class="mini-btn" onclick="resetWorkspace()">Reset</button>
      </div>
    </div>

    <!-- Mode A: Tap-to-step inverse operations -->
    <div id="step-builder-view">
      <div class="step-log" id="step-log"></div>
      <div class="action-chips-title">Tap an inverse operation:</div>
      <div class="action-chips" id="action-chips"></div>
    </div>

    <!-- Mode B: Freehand chalk canvas -->
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="freehand-canvas"></canvas>
    </div>
  </div>

  <div class="hint-box" id="hint-box">
    <button class="btn-hint" onclick="revealHint()">💡 Need a balancing clue?</button>
  </div>

  <div class="options-grid" id="options"></div>

  <button class="btn-next" id="btn-next" onclick="loadNext()">Next Problem ➔</button>
</div>

<!-- DOCKED BOTTOM SLIDE-UP CALCULATOR -->
<div class="calc-drawer" id="calc-drawer">
  <div class="calc-box">
    <div class="calc-handle" onclick="toggleCalculator()"></div>
    <div class="calc-top-row">
      <span class="calc-title">Quick Calculator</span>
      <button class="calc-close-icon" onclick="toggleCalculator()">✕</button>
    </div>
    <div class="calc-screen" id="calc-display">0</div>
    <div class="calc-grid">
      <button class="calc-key op" onclick="calcInput('C')">C</button>
      <button class="calc-key op" onclick="calcInput('⌫')">⌫</button>
      <button class="calc-key op" onclick="calcInput('/')">÷</button>
      <button class="calc-key op" onclick="calcInput('*')">×</button>

      <button class="calc-key" onclick="calcInput('7')">7</button>
      <button class="calc-key" onclick="calcInput('8')">8</button>
      <button class="calc-key" onclick="calcInput('9')">9</button>
      <button class="calc-key op" onclick="calcInput('-')">−</button>

      <button class="calc-key" onclick="calcInput('4')">4</button>
      <button class="calc-key" onclick="calcInput('5')">5</button>
      <button class="calc-key" onclick="calcInput('6')">6</button>
      <button class="calc-key op" onclick="calcInput('+')">+</button>

      <button class="calc-key" onclick="calcInput('1')">1</button>
      <button class="calc-key" onclick="calcInput('2')">2</button>
      <button class="calc-key" onclick="calcInput('3')">3</button>
      <button class="calc-key eq" onclick="calcCalculate()">=</button>

      <button class="calc-key" style="grid-column: span 2;" onclick="calcInput('0')">0</button>
      <button class="calc-key" onclick="calcInput('.')">.</button>
      <button class="calc-key op" onclick="toggleCalcSign()">±</button>
    </div>
  </div>
</div>

<script>
  let current = {};
  let currentLevel = '1';
  let score = 0;
  let streak = 0;
  let workMode = 'steps';

  // 1. COLLAPSE / EXPAND SCRATCHPAD WORKSPACE
  function toggleScratchpad() {
    const ws = document.getElementById('scratch-workspace');
    const btn = document.getElementById('scratch-toggle-btn');
    const label = document.getElementById('scratch-toggle-label');
    const isOpen = ws.classList.toggle('open');

    btn.classList.toggle('active', isOpen);
    label.innerText = isOpen ? "Hide Workspace" : "Open Scratchpad";

    if (isOpen && workMode === 'pen') {
      setTimeout(resizeCanvas, 50);
    }
  }

  // 2. SLIDE UP / DOWN BOTTOM CALCULATOR (Does not block the problem)
  function toggleCalculator() {
    const drawer = document.getElementById('calc-drawer');
    const btn = document.getElementById('calc-toggle-btn');
    const isOpen = drawer.classList.toggle('open');
    btn.classList.toggle('active', isOpen);
  }

  // 3. STEP-BY-STEP TAP WORKSPACE LOGIC
  function setupStepWorkspace(eq) {
    document.getElementById('sticky-eq').innerText = eq;
    const log = document.getElementById('step-log');
    log.innerHTML = `<div>Step 1: ${eq}</div>`;

    // Extract all numbers from the equation to suggest relevant inverse actions
    const numbers = Array.from(new Set(eq.match(/\d+/g) || [])).slice(0, 4);
    const chipsBox = document.getElementById('action-chips');
    chipsBox.innerHTML = '';

    numbers.forEach(num => {
      // Create + / - / ÷ chips for each number
      ['- ', '+ ', '÷ ', '× '].forEach(op => {
        const chip = document.createElement('button');
        chip.className = 'chip-btn';
        chip.innerText = `${op}${num}`;
        chip.onclick = () => applyStepAction(`${op}${num}`);
        chipsBox.appendChild(chip);
      });
    });
  }

  function applyStepAction(action) {
    const log = document.getElementById('step-log');
    const stepCount = log.children.length + 1;
    const newDiv = document.createElement('div');
    newDiv.innerHTML = `Step ${stepCount}: applied (${action}) on both sides`;
    log.appendChild(newDiv);
    log.scrollTop = log.scrollHeight;
  }

  function resetWorkspace() {
    setupStepWorkspace(current.equation);
    if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function switchWorkMode(mode) {
    workMode = mode;
    document.getElementById('btn-mode-steps').classList.toggle('active', mode === 'steps');
    document.getElementById('btn-mode-pen').classList.toggle('active', mode === 'pen');
    document.getElementById('step-builder-view').style.display = (mode === 'steps') ? 'block' : 'none';
    document.getElementById('canvas-wrap').style.display = (mode === 'pen') ? 'block' : 'none';
    if (mode === 'pen') resizeCanvas();
  }

  // 4. FREEHAND CHALK CANVAS (Optional fallback)
  const canvas = document.getElementById('freehand-canvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    ctx.strokeStyle = '#38BDF8';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - rect.left, y: cy - rect.top };
  }

  function startDraw(e) {
    isDrawing = true;
    const p = getCanvasPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }
  function draw(e) {
    if (!isDrawing) return;
    const p = getCanvasPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  function endDraw() { isDrawing = false; }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  window.addEventListener('mouseup', endDraw);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
  canvas.addEventListener('touchend', endDraw);

  // 5. CALCULATOR ARITHMETIC ENGINE
  let calcExpression = '0';
  function calcInput(char) {
    const display = document.getElementById('calc-display');
    if (char === 'C') {
      calcExpression = '0';
    } else if (char === '⌫') {
      calcExpression = calcExpression.length > 1 ? calcExpression.slice(0, -1) : '0';
    } else {
      if (calcExpression === '0' && !['+', '-', '*', '/'].includes(char)) {
        calcExpression = char;
      } else {
        calcExpression += char;
      }
    }
    display.innerText = calcExpression;
  }

  function calcCalculate() {
    const display = document.getElementById('calc-display');
    try {
      const sanitized = calcExpression.replace(/[^0-9+\-*/.]/g, '');
      const result = Function(`'use strict'; return (${sanitized})`)();
      calcExpression = String(Math.round(result * 1000) / 1000);
      display.innerText = calcExpression;
    } catch {
      display.innerText = 'Error';
      calcExpression = '0';
    }
  }

  function toggleCalcSign() {
    if (calcExpression.startsWith('-')) {
      calcExpression = calcExpression.slice(1);
    } else if (calcExpression !== '0') {
      calcExpression = '-' + calcExpression;
    }
    document.getElementById('calc-display').innerText = calcExpression;
  }

  // 6. QUESTION & GAMEPLAY FLOW
  function setLevel(lvl, btn) {
    currentLevel = lvl;
    document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadNext();
  }

  async function loadNext() {
    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('hint-box').innerHTML = '<button class="btn-hint" onclick="revealHint()">💡 Need a balancing clue?</button>';

    const res = await fetch(`/api/math-question?level=${currentLevel}`);
    current = await res.json();

    document.getElementById('eq-text').innerText = current.equation;
    setupStepWorkspace(current.equation);

    const optionsGrid = document.getElementById('options');
    optionsGrid.innerHTML = '';
    current.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerText = `x = ${opt}`;
      btn.onclick = () => selectOption(btn, opt);
      optionsGrid.appendChild(btn);
    });
  }

  function selectOption(button, chosen) {
    const allButtons = document.querySelectorAll('.opt-btn');
    allButtons.forEach(b => b.disabled = true);

    if (chosen === current.answer) {
      button.classList.add('correct');
      score += 10;
      streak += 1;
    } else {
      button.classList.add('wrong');
      streak = 0;
      allButtons.forEach(b => {
        if (b.innerText === `x = ${current.answer}`) b.classList.add('correct');
      });
    }

    document.getElementById('score').innerText = score;
    document.getElementById('streak').innerText = streak;
    document.getElementById('btn-next').style.display = 'block';
  }

  function revealHint() {
    document.getElementById('hint-box').innerHTML = current.hint;
  }

  loadNext();
</script>
</body>
</html>
